<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Ivan Scarpato — Motorsport Photography</title>
	
	<!-- Modern Fonts Import -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,ital,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">

	<style>
		:root { 
			--ink: #191918; 
			--muted: #6e6b66; 
			--paper: #f8f7f5; 
		}
		* { box-sizing: border-box; }
		body { 
			margin: 0; 
			color: var(--ink); 
			background: var(--paper); 
			font-family: 'Inter', -apple-system, sans-serif; 
			-webkit-font-smoothing: antialiased;
		}
		header { 
			display: flex; 
			justify-content: space-between; 
			align-items: flex-end; 
			padding: 48px 6vw 24px; 
			border-bottom: 1px solid #e2ded7; 
		}
		h1 { 
			margin: 0; 
			font-family: 'Newsreader', Georgia, serif; 
			font-size: clamp(2.4rem, 6vw, 5rem); 
			font-weight: 400;
			letter-spacing: -.03em; 
			line-height: 0.95;
		}
		header p { 
			margin: 0; 
			color: var(--muted); 
			font-size: .75rem; 
			font-weight: 600;
			letter-spacing: .15em; 
			text-transform: uppercase; 
		}
		main { padding: 4vw 6vw 6vw; }
		.intro { 
			max-width: 580px; 
			margin-bottom: 48px; 
			color: var(--muted); 
			font-size: 1.05rem;
			line-height: 1.6; 
		}
		.gallery { columns: 3 280px; column-gap: 20px; }
		figure { 
			margin: 0 0 20px; 
			break-inside: avoid; 
			position: relative; 
			overflow: hidden; 
			background: #e6e3dd; 
			border-radius: 2px;
		}
		figure img { 
			display: block; 
			width: 100%; 
			height: auto;
			transition: transform .6s cubic-bezier(0.16, 1, 0.3, 1); 
		}
		figure:hover img { transform: scale(1.03); }
		figcaption { 
			position: absolute; 
			bottom: 0; 
			width: 100%; 
			padding: 32px 16px 14px; 
			color: #fff; 
			font-size: .75rem; 
			font-weight: 500;
			letter-spacing: .05em;
			background: linear-gradient(transparent, rgba(0,0,0,0.75)); 
			opacity: 0; 
			transition: opacity .3s ease; 
		}
		figure:hover figcaption { opacity: 1; }
		footer { 
			display: flex;
			justify-content: space-between;
			padding: 28px 6vw; 
			color: var(--muted); 
			border-top: 1px solid #e2ded7; 
			font-size: .8rem; 
		}
		@media (max-width: 600px) { 
			header { display: block; } 
			header p { margin-top: 12px; } 
			.gallery { columns: 1; column-gap: 0px; } 
			figure { margin-bottom: 24px; } 
		}
	</style>
</head>
<body>
